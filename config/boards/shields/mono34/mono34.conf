# mono34 shield configuration.
#
# The Waveshare RP2040-Zero is a USB-only controller (the RP2040 has no radio),
# so there is nothing bluetooth-related to configure here. CONFIG_ZMK_USB is
# already turned on by the board's defconfig.

# Mouse keys (&mkp / &mmv / &msc), used by the MOUSE layer in the keymap, and
# the HID plumbing the trackpad's input listener feeds into.
CONFIG_ZMK_POINTING=y

# TPS43 trackpad: the Azoteq IQS5xx driver (see mono34-trackpad.dtsi) sits on
# I2C, which Zephyr does not turn on just because a bus node is enabled.
# CONFIG_INPUT_AZOTEQ_IQS5XX defaults to y once the devicetree node exists.
CONFIG_I2C=y

# Smooth scrolling if your host supports HID resolution multipliers; the
# trackpad's two-finger scroll is coarse (one detent per 32 counts) without it.
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Uncomment to get log output over the USB CDC-ACM console.
# CONFIG_ZMK_USB_LOGGING=y
