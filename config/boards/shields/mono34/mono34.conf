# mono34 shield configuration (nice!nano v2, wireless).
#
# Bluetooth and USB are already on in the nice_nano board's defconfig, and the
# board reports the battery level from its voltage divider.

# Mouse keys (&mkp / &mmv / &msc), used by the MOUSE layer in the keymap.
CONFIG_ZMK_POINTING=y

# Deep sleep after 15 minutes idle (the default timeout); any key wakes it
# (the kscan is a wakeup-source). Without it the 130 mAh cell lasts days, not
# weeks.
CONFIG_ZMK_SLEEP=y

# Uncomment to get log output over the USB CDC-ACM console.
# CONFIG_ZMK_USB_LOGGING=y
