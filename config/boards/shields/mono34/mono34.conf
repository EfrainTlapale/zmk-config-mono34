# mono34 shield configuration.
#
# The SparkFun Pro Micro RP2040 is a USB-only controller (the RP2040 has no
# radio), so there is nothing bluetooth-related to configure here. CONFIG_ZMK_USB
# is already turned on by the board's defconfig.

# Mouse keys (&mkp / &mmv / &msc), used by the MOUSE layer in the keymap.
CONFIG_ZMK_POINTING=y

# Uncomment to get log output over the USB CDC-ACM console.
# CONFIG_ZMK_USB_LOGGING=y
